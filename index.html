<style>
:root {
  --bg-dark:      #0d0d12;
  --bg-panel:     rgba(10, 10, 18, 0.88);
  --bg-choice:    rgba(20, 20, 35, 0.92);
  --border:       rgba(200, 185, 150, 0.35);
  --border-gold:  rgba(200, 185, 150, 0.7);
  --text-main:    #e8e0d0;
  --text-name:    #c8b87a;
  --text-choice:  #d4c990;
  --accent:       #c8b87a;
  --font-serif:   'Noto Serif JP', 'Yu Mincho', serif;
  --font-sans:    'Noto Sans JP', 'Hiragino Kaku Gothic Pro', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-dark);
  font-family: var(--font-serif);
  color: var(--text-main);
  overflow: hidden;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}
.screen.active { opacity: 1; pointer-events: all; }

#bg-layer {
  position: fixed;
  inset: 0;
  background: var(--bg-dark);
  transition: background 1s ease;
  z-index: 0;
}
#bg-layer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
}

/* ── タイトル ── */
#title-screen { z-index: 10; gap: 0; }

.title-deco {
  font-size: clamp(10px, 2vw, 14px);
  letter-spacing: 0.4em;
  color: var(--accent);
  opacity: 0.7;
  margin-bottom: 12px;
  text-transform: uppercase;
}
.title-main {
  font-size: clamp(24px, 6vw, 48px);
  letter-spacing: 0.15em;
  color: var(--text-main);
  text-shadow: 0 0 40px rgba(200,184,122,0.4);
  margin-bottom: 8px;
  line-height: 1.2;
  text-align: center;
  padding: 0 16px;
}
.title-line {
  width: 120px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  margin: 0 auto 40px;
}
.title-menu {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
  width: 100%;
  max-width: 280px;
}
.title-btn {
  width: 100%;
  padding: 13px 0;
  background: transparent;
  border: 1px solid var(--border-gold);
  color: var(--text-main);
  font-family: var(--font-serif);
  font-size: clamp(13px, 3.5vw, 16px);
  letter-spacing: 0.3em;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.title-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.3s;
}
.title-btn:hover::before, .title-btn:active::before { opacity: 0.12; }
.title-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── サブ画面共通 ── */
#howto-screen, #credit-screen, #gallery-screen {
  z-index: 10;
  padding: 32px 24px;
  max-width: 520px;
  width: 100%;
}
.sub-title {
  font-size: clamp(15px, 4vw, 20px);
  letter-spacing: 0.2em;
  color: var(--accent);
  margin-bottom: 24px;
  text-align: center;
}
.sub-content {
  font-family: var(--font-sans);
  font-size: clamp(13px, 3vw, 15px);
  line-height: 2;
  color: var(--text-main);
  opacity: 0.85;
  border: 1px solid var(--border);
  padding: 24px;
  background: var(--bg-panel);
  margin-bottom: 28px;
}
.back-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-main);
  font-family: var(--font-serif);
  font-size: 14px;
  letter-spacing: 0.3em;
  padding: 12px 40px;
  cursor: pointer;
  transition: all 0.3s;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── エンド一覧画面 ── */
#gallery-screen { max-width: 560px; }

.gallery-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 20px;
}
.gallery-count {
  font-family: var(--font-sans);
  font-size: clamp(11px, 2.5vw, 13px);
  color: var(--accent);
  letter-spacing: 0.15em;
}
.complete-badge {
  font-family: var(--font-sans);
  font-size: clamp(10px, 2vw, 12px);
  letter-spacing: 0.2em;
  color: #0d0d12;
  background: var(--accent);
  padding: 4px 12px;
  display: none;
}
.complete-badge.show { display: block; }

.gallery-list {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 28px;
  max-height: 55vh;
  overflow-y: auto;
  padding-right: 4px;
}
.gallery-list::-webkit-scrollbar { width: 2px; }
.gallery-list::-webkit-scrollbar-thumb { background: var(--border-gold); }

.gallery-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}
.gallery-item.unlocked { border-color: rgba(200,185,150,0.5); }

/* エンド種別カラーバー */
.gallery-item::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}
.gallery-item.type-good::before    { background: #7abfc8; }
.gallery-item.type-normal::before  { background: var(--accent); }
.gallery-item.type-bad::before     { background: #c87a7a; }
.gallery-item.type-another::before { background: #9a7ac8; }
.gallery-item.type-hidden::before  { background: #7ac87a; }

.gallery-icon {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 16px;
  color: var(--accent);
  background: rgba(200,185,150,0.05);
}
.gallery-item.locked .gallery-icon {
  color: rgba(200,185,150,0.2);
}

.gallery-info { flex: 1; min-width: 0; }
.gallery-type {
  font-family: var(--font-sans);
  font-size: clamp(9px, 2vw, 11px);
  letter-spacing: 0.3em;
  margin-bottom: 4px;
}
.gallery-item.unlocked .gallery-type { color: var(--accent); opacity: 0.8; }
.gallery-item.locked   .gallery-type { color: var(--text-main); opacity: 0.3; }

.gallery-title {
  font-size: clamp(13px, 3vw, 15px);
  letter-spacing: 0.1em;
  line-height: 1.4;
}
.gallery-item.unlocked .gallery-title { color: var(--text-main); }
.gallery-item.locked   .gallery-title { color: var(--text-main); opacity: 0.25; }

.gallery-new {
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.15em;
  color: #0d0d12;
  background: #c87a7a;
  padding: 2px 8px;
  flex-shrink: 0;
  display: none;
}
.gallery-item.is-new .gallery-new { display: block; }

/* ── ゲーム画面 ── */
#game-screen {
  z-index: 10;
  justify-content: flex-end;
  padding: 0 0 24px;
}
#text-panel {
  width: min(680px, 94vw);
  background: var(--bg-panel);
  border: 1px solid var(--border);
  padding: 20px 24px 18px;
  cursor: pointer;
  position: relative;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  user-select: none;
  -webkit-user-select: none;
}
#text-panel::before {
  content: '';
  position: absolute;
  top: -1px; left: 20px; right: 20px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
#char-name {
  font-size: clamp(13px, 3vw, 15px);
  color: var(--text-name);
  letter-spacing: 0.2em;
  margin-bottom: 10px;
  min-height: 20px;
  font-family: var(--font-sans);
}
#story-text {
  font-size: clamp(15px, 3.8vw, 18px);
  line-height: 1.9;
  color: var(--text-main);
  min-height: 80px;
  white-space: pre-wrap;
}
#next-indicator {
  position: absolute;
  bottom: 10px; right: 16px;
  width: 10px; height: 10px;
  border-right: 2px solid var(--accent);
  border-bottom: 2px solid var(--accent);
  transform: rotate(45deg);
  opacity: 0;
  animation: blink 1.2s infinite;
}
#next-indicator.show { opacity: 1; }
@keyframes blink {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}

/* ── 選択肢 ── */
#choice-panel {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 24px;
  background: rgba(0,0,0,0.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
  z-index: 20;
}
#choice-panel.show { opacity: 1; pointer-events: all; }

.choice-label {
  font-family: var(--font-sans);
  font-size: clamp(11px, 2.5vw, 13px);
  letter-spacing: 0.3em;
  color: var(--accent);
  opacity: 0.7;
  margin-bottom: 8px;
}
.choice-btn {
  width: min(480px, 90vw);
  padding: 18px 24px;
  background: var(--bg-choice);
  border: 1px solid var(--border-gold);
  color: var(--text-choice);
  font-family: var(--font-serif);
  font-size: clamp(14px, 3.5vw, 17px);
  letter-spacing: 0.1em;
  line-height: 1.6;
  cursor: pointer;
  text-align: left;
  transition: all 0.25s;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.choice-btn:hover, .choice-btn:active {
  background: rgba(200,184,122,0.15);
  border-color: var(--accent);
  color: var(--accent);
}

/* ── エンディング画面 ── */
#ending-screen { z-index: 10; gap: 20px; padding: 24px; }

.ending-label {
  font-family: var(--font-sans);
  font-size: clamp(11px, 2.5vw, 13px);
  letter-spacing: 0.5em;
  color: var(--accent);
  opacity: 0.7;
}
.ending-title {
  font-size: clamp(20px, 5.5vw, 36px);
  letter-spacing: 0.2em;
  color: var(--text-main);
  text-shadow: 0 0 30px rgba(200,184,122,0.4);
  text-align: center;
  line-height: 1.4;
}
.ending-text {
  font-family: var(--font-sans);
  font-size: clamp(13px, 3vw, 15px);
  line-height: 2;
  color: var(--text-main);
  opacity: 0.75;
  text-align: center;
  max-width: 400px;
  white-space: pre-wrap;
}
.ending-line {
  width: 80px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.ending-btn {
  background: transparent;
  border: 1px solid var(--border-gold);
  color: var(--text-main);
  font-family: var(--font-serif);
  font-size: clamp(13px, 3vw, 16px);
  letter-spacing: 0.35em;
  padding: 13px 40px;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 4px;
}
.ending-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── フェード ── */
#fade-overlay {
  position: fixed;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  z-index: 100;
  transition: opacity 0.5s ease;
}
#fade-overlay.fade-in { opacity: 1; pointer-events: all; }

@media (min-width: 600px) {
  #text-panel { padding: 24px 32px 22px; }
}

/* ================================================================
   Web Audio API 音声システム
   ================================================================ */

var _actx       = null;   // AudioContext
var _audioReady = false;  // ユーザー操作後にtrue
var _bgmNodes   = [];     // 現在のBGMノード群
var _currentBgm = null;   // 現在のBGMキー
var BGM_VOL     = 0.18;   // BGMマスター音量
var SE_VOL      = 0.5;    // SEマスター音量

function getCtx() {
  if (!_actx) {
    _actx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (_actx.state === "suspended") { _actx.resume(); }
  return _actx;
}

function unlockAudio() {
  if (_audioReady) return;
  _audioReady = true;
  getCtx();
}
document.addEventListener("click",      unlockAudio, { once: true });
document.addEventListener("touchstart", unlockAudio, { once: true });
document.addEventListener("keydown",    unlockAudio, { once: true });

/* ── BGM定義（プログラム生成） ── */
var BGM_DEFS = {

  // 穏やかな環境音：低いドローン＋微かな揺らぎ
  calm: function(ctx, masterGain) {
    var nodes = [];
    [55, 82.4, 110].forEach(function(freq, i) {
      var osc = ctx.createOscillator();
      var g   = ctx.createGain();
      var lfo = ctx.createOscillator();
      var lg  = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      lfo.type = "sine";
      lfo.frequency.value = 0.08 + i * 0.03;
      lg.gain.value = freq * 0.003;
      g.gain.value  = BGM_VOL * (0.5 - i * 0.12);
      lfo.connect(lg); lg.connect(osc.frequency);
      osc.connect(g);  g.connect(masterGain);
      lfo.start(); osc.start();
      nodes.push(osc, lfo, g, lg);
    });
    return nodes;
  },

  // 緊張BGM：低音パルス＋不安定な和音
  tension: function(ctx, masterGain) {
    var nodes = [];
    // 低音パルス
    var lfo  = ctx.createOscillator();
    var lfog = ctx.createGain();
    lfo.type = "sine"; lfo.frequency.value = 1.4;
    lfog.gain.value = 0.0;
    lfo.connect(lfog); lfo.start();

    [49, 73.4, 98].forEach(function(freq, i) {
      var osc = ctx.createOscillator();
      var g   = ctx.createGain();
      var tremolo = ctx.createGain();
      osc.type = i === 0 ? "sawtooth" : "sine";
      osc.frequency.value = freq;
      var tLfo  = ctx.createOscillator();
      var tLfoG = ctx.createGain();
      tLfo.frequency.value = 1.4;
      tLfoG.gain.value = 0.3;
      tLfo.connect(tLfoG); tLfoG.connect(tremolo.gain);
      tremolo.gain.value = 0.7;
      g.gain.value = BGM_VOL * (0.45 - i * 0.1);
      osc.connect(tremolo); tremolo.connect(g); g.connect(masterGain);
      tLfo.start(); osc.start();
      nodes.push(osc, g, tLfo, tLfoG, tremolo);
    });
    // 高域の不安定音
    var hi  = ctx.createOscillator();
    var hig = ctx.createGain();
    hi.type = "triangle"; hi.frequency.value = 523.2;
    var hiLfo  = ctx.createOscillator();
    var hiLfoG = ctx.createGain();
    hiLfo.frequency.value = 0.25; hiLfoG.gain.value = 8;
    hiLfo.connect(hiLfoG); hiLfoG.connect(hi.frequency);
    hig.gain.value = BGM_VOL * 0.04;
    hi.connect(hig); hig.connect(masterGain);
    hiLfo.start(); hi.start();
    nodes.push(hi, hig, hiLfo, hiLfoG, lfo, lfog);
    return nodes;
  },

  // ホラーBGM：不協和ドローン＋ランダム高音
  horror: function(ctx, masterGain) {
    var nodes = [];
    // 不協和な低音層
    [40, 56.2, 84.5, 113].forEach(function(freq, i) {
      var osc = ctx.createOscillator();
      var g   = ctx.createGain();
      var lfo = ctx.createOscillator();
      var lg  = ctx.createGain();
      osc.type = i % 2 === 0 ? "sawtooth" : "square";
      osc.frequency.value = freq;
      lfo.frequency.value = 0.05 + i * 0.04;
      lg.gain.value = freq * 0.004;
      g.gain.value  = BGM_VOL * (0.4 - i * 0.06);
      lfo.connect(lg); lg.connect(osc.frequency);
      osc.connect(g);  g.connect(masterGain);
      lfo.start(); osc.start();
      nodes.push(osc, lfo, g, lg);
    });
    // ランダムなピタッと高音（不規則）
    function scheduleRandom() {
      if (!_actx) return;
      var delay = 3 + Math.random() * 7;
      var t = setTimeout(function() {
        if (_currentBgm !== "horror" || !_actx) return;
        var osc2 = ctx.createOscillator();
        var env  = ctx.createGain();
        osc2.type = "sine";
        osc2.frequency.value = 800 + Math.random() * 600;
        env.gain.setValueAtTime(0, ctx.currentTime);
        env.gain.linearRampToValueAtTime(BGM_VOL * 0.08, ctx.currentTime + 0.01);
        env.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
        osc2.connect(env); env.connect(masterGain);
        osc2.start(); osc2.stop(ctx.currentTime + 0.8);
        scheduleRandom();
      }, delay * 1000);
      nodes.push({ _timer: t });
    }
    scheduleRandom();
    return nodes;
  },

  // エンディング：静かなアンビエント
  ending: function(ctx, masterGain) {
    var nodes = [];
    [65.4, 98, 130.8, 196].forEach(function(freq, i) {
      var osc = ctx.createOscillator();
      var g   = ctx.createGain();
      var lfo = ctx.createOscillator();
      var lg  = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      lfo.type = "sine";
      lfo.frequency.value = 0.05 + i * 0.02;
      lg.gain.value = 1.5;
      g.gain.value  = BGM_VOL * (0.38 - i * 0.06);
      lfo.connect(lg); lg.connect(osc.frequency);
      osc.connect(g);  g.connect(masterGain);
      lfo.start(); osc.start();
      nodes.push(osc, lfo, g, lg);
    });
    return nodes;
  },
};

/* ── BGM再生・停止 ── */
function stopBgmNodes(nodes, onDone) {
  // タイマー系を先にクリア
  nodes.forEach(function(n) { if (n && n._timer) clearTimeout(n._timer); });
  var audioNodes = nodes.filter(function(n) { return n && n.disconnect; });
  if (audioNodes.length === 0) { if (onDone) onDone(); return; }
  var masterG = getCtx().createGain();
  masterG.gain.value = 1;
  masterG.connect(getCtx().destination);
  // フェードアウト後に切断
  var ctx = getCtx();
  masterG.gain.setValueAtTime(1, ctx.currentTime);
  masterG.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
  setTimeout(function() {
    audioNodes.forEach(function(n) { try { n.disconnect(); } catch(e){} });
    try { masterG.disconnect(); } catch(e){}
    if (onDone) onDone();
  }, 900);
}

function playBgm(key) {
  if (!_audioReady) return;
  if (_currentBgm === key) return;
  var def = BGM_DEFS[key];
  if (!def) return;
  _currentBgm = key;

  var oldNodes = _bgmNodes;
  _bgmNodes = [];

  var ctx = getCtx();
  var masterGain = ctx.createGain();
  masterGain.gain.setValueAtTime(0, ctx.currentTime);
  masterGain.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.5);
  masterGain.connect(ctx.destination);

  _bgmNodes = def(ctx, masterGain);
  _bgmNodes.push(masterGain);

  // 古いBGMをフェードアウト
  if (oldNodes.length > 0) { stopBgmNodes(oldNodes, null); }
}

function stopBgm() {
  if (_bgmNodes.length === 0) return;
  _currentBgm = null;
  var nodes = _bgmNodes;
  _bgmNodes = [];
  stopBgmNodes(nodes, null);
}

/* ── SE定義（プログラム生成） ── */
var SE_DEFS = {

  // テキスト送りクリック：短い柔らかいタップ音
  click: function(ctx) {
    var osc = ctx.createOscillator();
    var g   = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = 800;
    osc.frequency.setTargetAtTime(400, ctx.currentTime, 0.015);
    g.gain.setValueAtTime(SE_VOL * 0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.06);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.07);
  },

  // 選択肢決定：明るめの2音
  decision: function(ctx) {
    [0, 0.08].forEach(function(delay, i) {
      var osc = ctx.createOscillator();
      var g   = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = i === 0 ? 660 : 880;
      g.gain.setValueAtTime(0, ctx.currentTime + delay);
      g.gain.linearRampToValueAtTime(SE_VOL * 0.35, ctx.currentTime + delay + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.18);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.2);
    });
  },

  // ノック音：低い打撃音×3
  knock: function(ctx) {
    [0, 0.22, 0.44].forEach(function(delay) {
      var buf = ctx.createBuffer(1, ctx.sampleRate * 0.12, ctx.sampleRate);
      var d   = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
      }
      var src = ctx.createBufferSource();
      var g   = ctx.createGain();
      var filt = ctx.createBiquadFilter();
      filt.type = "lowpass"; filt.frequency.value = 180;
      src.buffer = buf;
      g.gain.setValueAtTime(SE_VOL * 1.4, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.1);
      src.connect(filt); filt.connect(g); g.connect(ctx.destination);
      src.start(ctx.currentTime + delay);
    });
  },

  // ドア音：軋み＋閉まる音
  door: function(ctx) {
    // 軋み
    var osc = ctx.createOscillator();
    var g   = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(120, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(60, ctx.currentTime + 0.4);
    g.gain.setValueAtTime(SE_VOL * 0.15, ctx.currentTime);
    g.gain.linearRampToValueAtTime(SE_VOL * 0.08, ctx.currentTime + 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.45);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.5);
    // 閉まる低音
    var buf = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
    var d   = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
    }
    var src2 = ctx.createBufferSource();
    var g2   = ctx.createGain();
    var filt2 = ctx.createBiquadFilter();
    filt2.type = "lowpass"; filt2.frequency.value = 120;
    src2.buffer = buf;
    g2.gain.setValueAtTime(SE_VOL * 1.2, ctx.currentTime + 0.5);
    g2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.65);
    src2.connect(filt2); filt2.connect(g2); g2.connect(ctx.destination);
    src2.start(ctx.currentTime + 0.5);
  },

  // ホラースティンガー：不協和一撃
  stinger: function(ctx) {
    [180, 254, 338, 451].forEach(function(freq, i) {
      var osc = ctx.createOscillator();
      var g   = ctx.createGain();
      osc.type = i % 2 === 0 ? "sawtooth" : "square";
      osc.frequency.value = freq;
      osc.frequency.setTargetAtTime(freq * 0.7, ctx.currentTime + 0.05, 0.3);
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(SE_VOL * (0.28 - i * 0.04), ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.4);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 1.5);
    });
  },

  // チャイム：場面転換
  chime: function(ctx) {
    [523.2, 659.3, 783.9].forEach(function(freq, i) {
      var osc = ctx.createOscillator();
      var g   = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      var t = ctx.currentTime + i * 0.12;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(SE_VOL * 0.22, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + 1.0);
    });
  },
};

function playSe(key) {
  if (!_audioReady) return;
  var def = SE_DEFS[key];
  if (!def) return;
  try { def(getCtx()); } catch(e) {}
}

function playClickSe() {
  playSe("click");
}

var currentSceneIndex = 0;
var isTyping = false;
var typeTimer = null;
var targetText = "";
var _pendingChoice = null;
var _newlyUnlocked = null;
var TYPING_SPEED = 45;

var sceneMap = {};

/* ── セーブデータ（LocalStorage） ── */
function loadSave() {
  try {
    var raw = localStorage.getItem(SCENARIO.saveKey);
    return raw ? JSON.parse(raw) : { unlocked: {}, newFlags: {} };
  } catch(e) {
    return { unlocked: {}, newFlags: {} };
  }
}
function writeSave(data) {
  try { localStorage.setItem(SCENARIO.saveKey, JSON.stringify(data)); } catch(e) {}
}
function unlockEnding(id) {
  var data = loadSave();
  var isNew = !data.unlocked[id];
  data.unlocked[id] = true;
  if (isNew) data.newFlags[id] = true;
  writeSave(data);
  return isNew;
}
function clearNew(id) {
  var data = loadSave();
  delete data.newFlags[id];
  writeSave(data);
}

/* ── エンディング一覧を構築・表示 ── */
var TYPE_LABELS = {
  good:    "GOOD END",
  normal:  "NORMAL END",
  bad:     "BAD END",
  another: "ANOTHER END",
  hidden:  "HIDDEN END",
};
var TYPE_ICONS = {
  good:    "★",
  normal:  "◆",
  bad:     "✕",
  another: "◈",
  hidden:  "✦",
};

function getEndingScenes() {
  return SCENARIO.scenes.filter(function(s) { return s.ending; });
}

function openGallery() {
  renderGallery();
  showScreen("gallery-screen");
}

function renderGallery() {
  var endings = getEndingScenes();
  var data = loadSave();
  var total = endings.length;
  var got = 0;

  var list = document.getElementById("gallery-list");
  list.innerHTML = "";

  endings.forEach(function(scene) {
    var e = scene.ending;
    var id = scene.id;
    var unlocked = !!data.unlocked[id];
    var isNew = !!data.newFlags[id];
    if (unlocked) got++;

    var type = e.type || "normal";
    var item = document.createElement("div");
    item.className = "gallery-item type-" + type + (unlocked ? " unlocked" : " locked") + (isNew ? " is-new" : "");

    var icon = document.createElement("div");
    icon.className = "gallery-icon";
    icon.textContent = unlocked ? (TYPE_ICONS[type] || "◆") : "？";

    var info = document.createElement("div");
    info.className = "gallery-info";

    var typeEl = document.createElement("div");
    typeEl.className = "gallery-type";
    typeEl.textContent = unlocked ? (TYPE_LABELS[type] || e.label) : "？？？";

    var titleEl = document.createElement("div");
    titleEl.className = "gallery-title";
    titleEl.textContent = unlocked ? e.title : "── 未 回 収 ──";

    info.appendChild(typeEl);
    info.appendChild(titleEl);

    var newBadge = document.createElement("div");
    newBadge.className = "gallery-new";
    newBadge.textContent = "NEW";

    item.appendChild(icon);
    item.appendChild(info);
    item.appendChild(newBadge);
    list.appendChild(item);

    // NEWを見たらフラグを消す
    if (isNew) {
      clearNew(id);
      // 少し遅らせてDOMに描画後にクラス削除（アニメーション的演出用）
      setTimeout(function() { item.classList.remove("is-new"); }, 2000);
    }
  });

  document.getElementById("gallery-count").textContent = got + " / " + total + " 回収";
  var badge = document.getElementById("complete-badge");
  if (got === total && total > 0) {
    badge.classList.add("show");
  } else {
    badge.classList.remove("show");
  }
}

/* ── 画面切替 ── */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}

function fadeTransition(callback) {
  var overlay = document.getElementById("fade-overlay");
  overlay.classList.add("fade-in");
  setTimeout(function() {
    callback();
    setTimeout(function() { overlay.classList.remove("fade-in"); }, 50);
  }, 500);
}

function setBg(key) {
  if (!key) return;
  var val = SCENARIO.backgrounds[key] || key;
  document.getElementById("bg-layer").style.background = val;
}

/* ── テキスト送り ── */
function typeText(text) {
  var el = document.getElementById("story-text");
  var indicator = document.getElementById("next-indicator");
  clearTimeout(typeTimer);
  indicator.classList.remove("show");
  isTyping = true;
  targetText = text;
  el.textContent = "";
  var i = 0;
  function tick() {
    if (i < targetText.length) {
      el.textContent += targetText[i++];
      typeTimer = setTimeout(tick, TYPING_SPEED);
    } else {
      isTyping = false;
      indicator.classList.add("show");
    }
  }
  tick();
}

function skipTyping() {
  if (!isTyping) return;
  clearTimeout(typeTimer);
  document.getElementById("story-text").textContent = targetText;
  document.getElementById("next-indicator").classList.add("show");
  isTyping = false;
}

/* ── シーン管理 ── */
function buildSceneMap() {
  SCENARIO.scenes.forEach(function(scene, i) {
    scene._index = i;
    sceneMap[scene.id] = scene;
  });
}

function showScene(idOrIndex) {
  var scene;
  if (typeof idOrIndex === "string") {
    scene = sceneMap[idOrIndex];
  } else {
    scene = SCENARIO.scenes[idOrIndex];
  }
  if (!scene) { return; }

  currentSceneIndex = scene._index;

  if (scene.ending) {
    showEnding(scene.ending, scene.id);
    return;
  }

  if (scene.bg) setBg(scene.bg);
  if (scene.bgm !== undefined) {
    if (scene.bgm === null) { stopBgm(); }
    else { playBgm(scene.bgm); }
  }
  if (scene.se) { playSe(scene.se); }
  document.getElementById("char-name").textContent = scene.name || "";
  typeText(scene.text || "");
  _pendingChoice = scene.choice || null;
}

function onScreenTap() {
  playClickSe();
  if (isTyping) { skipTyping(); return; }
  if (_pendingChoice) {
    showChoice(_pendingChoice);
    _pendingChoice = null;
    return;
  }
  var current = SCENARIO.scenes[currentSceneIndex];
  if (current.next) {
    showScene(current.next);
  } else {
    var next = currentSceneIndex + 1;
    if (next < SCENARIO.scenes.length) showScene(next);
  }
}

/* ── 選択肢 ── */
function showChoice(choice) {
  var btnA = document.getElementById("choice-a");
  var btnB = document.getElementById("choice-b");
  btnA.textContent = choice.options[0].label;
  btnB.textContent = choice.options[1].label;
  btnA.dataset.next = choice.options[0].next;
  btnB.dataset.next = choice.options[1].next;
  document.getElementById("choice-panel").classList.add("show");
}

function selectChoice(which) {
  playSe("decision");
  var btn = document.getElementById("choice-" + which);
  var nextId = btn.dataset.next;
  document.getElementById("choice-panel").classList.remove("show");
  setTimeout(function() { showScene(nextId); }, 300);
}

/* ── エンディング ── */
function showEnding(ending, sceneId) {
  if (ending.bg) setBg(ending.bg);
  if (ending.bgm !== undefined) {
    if (ending.bgm === null) { stopBgm(); }
    else { playBgm(ending.bgm); }
  }

  // 解放記録
  var isNew = unlockEnding(sceneId);
  _newlyUnlocked = isNew ? sceneId : null;

  var type = ending.type || "normal";
  var labelText = TYPE_LABELS[type] || ending.label || "ENDING";

  document.getElementById("ending-label").textContent = labelText;
  document.getElementById("ending-title").textContent = ending.title || "";
  document.getElementById("ending-text").textContent = ending.text || "";

  fadeTransition(function() { showScreen("ending-screen"); });
}

/* ── ゲーム開始 ── */
function startGame() {
  currentSceneIndex = 0;
  _pendingChoice = null;
  _newlyUnlocked = null;
  fadeTransition(function() {
    showScreen("game-screen");
    showScene(0);
  });
}

/* ── タイトルへ ── */
function goTitle() {
  stopBgm();
  fadeTransition(function() {
    showScreen("title-screen");
  });
}

/* ── キーボード ── */
document.addEventListener("keydown", function(e) {
  if (e.key === " " || e.key === "Enter") {
    if (document.getElementById("game-screen").classList.contains("active")) {
      e.preventDefault();
      onScreenTap();
    }
  }
});

/* ── 初期化 ── */
buildSceneMap();
document.getElementById("title-text").textContent = SCENARIO.title;
document.getElementById("credit-content").innerHTML = SCENARIO.credit;
setBg("apartment");
showScreen("title-screen");
</script>
